name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infra_monitor
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      INFRA_MONITOR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/postgres?sslmode=disable
      INFRA_MONITOR_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -race ./...
      - name: build
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/infra-monitor

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: generated API types are up to date
        working-directory: .
        run: |
          make web-client
          git diff --exit-code -- web/src/api/schema.d.ts || { echo "::error::web/src/api/schema.d.ts is stale: run make web-client and commit it"; exit 1; }
      - run: npm run type-check
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.1
      - name: helm lint
        run: helm lint deploy/helm/infra-monitor
      - name: helm template
        run: |
          for f in deploy/helm/infra-monitor/ci/*.yaml; do
            echo "::group::$f"
            helm template im deploy/helm/infra-monitor -f "$f" > "rendered-$(basename "$f")"
            echo "::endgroup::"
          done
      - name: kubeconform
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas rendered-*.yaml
