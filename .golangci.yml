version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - errcheck
    - gocritic
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    errcheck:
      check-type-assertions: false
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - sprintfQuotedString
    staticcheck:
      checks: ["all", "-QF1001", "-QF1012", "-ST1000", "-ST1003", "-ST1020", "-ST1021", "-ST1022"]
    misspell:
      locale: US
    gosec:
      excludes:
        - G115 # integer overflow conversions: noisy for ids
  exclusions:
    generated: lax
    paths:
      - web/
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx
          - bodyclose
          - dogsled

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
