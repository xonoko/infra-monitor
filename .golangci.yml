version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - errcheck
    - gocritic
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    errcheck:
      check-type-assertions: false
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
    misspell:
      locale: US
    gosec:
      excludes:
        - G115 # integer overflow conversions: noisy for ids
  exclusions:
    generated: lax
    paths:
      - web/
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
          - noctx
          - bodyclose

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
