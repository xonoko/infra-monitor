{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "infra-monitor.fullname" . }}
  labels:
    {{- include "infra-monitor.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "infra-monitor.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- if .Values.tls.enabled }}
      scheme: https
      tlsConfig:
        serverName: {{ include "infra-monitor.fullname" . }}.{{ .Release.Namespace }}.svc
        ca:
          secret:
            name: {{ include "infra-monitor.tlsSecretName" . }}
            key: ca.crt
      {{- end }}
{{- end }}
{{- if .Values.metrics.vmServiceScrape.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ include "infra-monitor.fullname" . }}
  labels:
    {{- include "infra-monitor.labels" . | nindent 4 }}
    {{- with .Values.metrics.vmServiceScrape.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "infra-monitor.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.vmServiceScrape.interval }}
      {{- if .Values.tls.enabled }}
      scheme: https
      tlsConfig:
        serverName: {{ include "infra-monitor.fullname" . }}.{{ .Release.Namespace }}.svc
        ca:
          secret:
            name: {{ include "infra-monitor.tlsSecretName" . }}
            key: ca.crt
      {{- end }}
{{- end }}
